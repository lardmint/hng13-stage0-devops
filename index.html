<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HNG13 Stage 0 - DevOps</title>
</head>
<body>
    <h1>HNG13 Stage 0 - DevOps Track</h1>
    
    <div>
        <h2>Student Information</h2>
        <p><strong>Email:</strong> lardmint@gmail.com</p>
        <p><strong>Current Datetime (ISO):</strong> <span id="datetime"></span></p>
        <p><strong>Current Datetime (UTC):</strong> <span id="datetime-utc"></span></p>
        <p><strong>Track:</strong> DevOps</p>
        <p><strong>GitHub Repository:</strong> 
            <a href="https://github.com/lardmint/hng13-stage0-devops" target="_blank">
                View Repository
            </a>
        </p>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            document.getElementById('datetime').textContent = now.toISOString();
            document.getElementById('datetime-utc').textContent = now.toUTCString();
        }
        
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
